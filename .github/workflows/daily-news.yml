name: نشرة أخبار الذكاء الاصطناعي

on:
  schedule:
    # ثلاث محاولات في دقائق بعيدة عن بداية الساعة لتقليل أثر تأخير/إسقاط جدولة GitHub.
    # علامة الإرسال اليومية داخل state تمنع وصول أكثر من نشرة واحدة.
    - cron: "17 5 * * *" # 08:17 بتوقيت الرياض
    - cron: "17 6 * * *" # 09:17 بتوقيت الرياض
    - cron: "17 7 * * *" # 10:17 بتوقيت الرياض
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: daily-news-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # مفتاح متجدد لأن ذاكرة التخزين غير قابلة للتعديل بعد إنشائها،
      # و restore-keys يسترجع أحدث نسخة محفوظة من التشغيلة السابقة.
      - name: استرجاع ذاكرة الأخبار المرسلة
        uses: actions/cache@v6
        with:
          path: state
          key: seen-news-${{ github.run_id }}
          restore-keys: seen-news-

      - name: إرسال النشرة
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python main.py
