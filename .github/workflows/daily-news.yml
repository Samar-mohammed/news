name: AI News Digest

on:
  schedule:
    # Three attempts at minutes offset from the hour to reduce the impact of GitHub scheduling delay/drops.
    # The daily send marker in state prevents more than one digest from going out.
    - cron: "17 5 * * *" # 08:17 Riyadh time
    - cron: "17 6 * * *" # 09:17 Riyadh time
    - cron: "17 7 * * *" # 10:17 Riyadh time
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: daily-news-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A rolling key because the cache is immutable once created,
      # and restore-keys pulls the latest saved copy from the previous run.
      - name: Restore sent-news memory
        uses: actions/cache@v6
        with:
          path: state
          key: seen-news-${{ github.run_id }}
          restore-keys: seen-news-

      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python main.py
